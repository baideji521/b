<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI_剪辑师_好帮手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>AI_剪辑师_好帮手</h1>
    <p class="sub">给 AI_剪辑师 打工：上传 txt 到 Gemini / DeepSeek，把 JSON 送回去</p>

    <dl>
      <dt>AI_剪辑师</dt>
      <dd id="endpoint">读取中…</dd>
      <dt>配对</dt>
      <dd id="paired">读取中…</dd>
      <dt>状态</dt>
      <dd id="state">读取中…</dd>
    </dl>

    <div class="row">
      <label for="port">端口</label>
      <input id="port" type="number" min="1" max="65535" step="1" placeholder="5998" />
      <button id="savePort" type="button">保存</button>
    </div>
    <p class="hint" id="portHint">默认 5998，要和 AI_剪辑师 里显示的端口一致。</p>

    <div class="row">
      <label for="closeTab">
        <input id="closeTab" type="checkbox" />
        关闭浏览器
      </label>
    </div>
    <p class="hint" id="closeHint">勾上：JSON 回传成功后，关掉扩展自己开的那个对话标签页。你本来开着的窗口不动。</p>


    <button id="pair" type="button">重新配对</button>
    <p class="hint">
      先在 AI_剪辑师 里点「配对扩展」开配对窗口，再点这里。
    </p>


    <script src="popup.js" type="module"></script>
  </body>
</html>
